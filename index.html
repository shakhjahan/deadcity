<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dead City — 2D Zombie Survival</title>
  <link rel="icon" href="assets/bullet.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- HUD: left (portrait / hp / ammo / kills) -->
  <div id="hudLeft" class="hud-left">
    <div class="portrait">
      <img id="portraitImg" src="assets/player.png" alt="player">
    </div>
    <div class="stats">
      <div class="stat-row">
        <div class="label">HP</div>
        <div class="bar" id="hpBar"><div class="fill" id="hpFill"></div></div>
        <div class="value" id="hpVal">100</div>
      </div>
      <div class="stat-row">
        <div class="label">AMMO</div>
        <div class="bar" id="ammoBar"><div class="fill" id="ammoFill"></div></div>
        <div class="value" id="ammoVal">30/120</div>
      </div>
      <div class="stat-row small">
        <div class="label">KILLS</div>
        <div class="value" id="killsVal">0</div>
      </div>
    </div>
  </div>

  <!-- HUD: top-right minimap placeholder -->
  <div id="minimap" class="minimap">
    <canvas id="minimapCanvas" width="240" height="120"></canvas>
  </div>

  <!-- controls bottom -->
  <div id="controlsBottom" class="controls-bottom">
    <div class="controls-row">A D — Movement &ensp; W — Ladder &ensp; SPACE — Jump &ensp; E — Door &ensp; Click — Shoot &ensp; R — Reload</div>
  </div>

  <!-- overlays already in index.html (menu/pause) -->
  <div id="overlayMenu" class="overlay">
    <div class="panel">
      <h1>Dead City</h1>
      <p class="muted">2D Zombie Survival — HTML/CSS/JS</p>
      <div class="buttons">
        <button id="startBtn" class="btn primary">Start Game</button>
        <button id="fullscreenBtn" class="btn">Toggle Fullscreen</button>
        <div class="meta">High Score: <span id="highScore">0</span></div>
      </div>
      <p class="controls">Controls: WASD / Arrow keys to move · Mouse to aim · Click to shoot · Esc to pause</p>
    </div>
  </div>

  <div id="overlayPause" class="overlay hidden">
    <div class="panel">
      <h2>Paused</h2>
      <div class="buttons">
        <button id="resumeBtn" class="btn primary">Resume</button>
        <button id="restartBtn" class="btn">Restart</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
